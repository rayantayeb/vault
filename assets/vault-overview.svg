<svg xmlns="http://www.w3.org/2000/svg" width="1100" height="320" viewBox="0 0 1100 320">
  <style>
    text { font-family: Arial, Helvetica, sans-serif; fill: #111; }
    .box { fill: #f6f8fa; stroke: #d0d7de; stroke-width: 2; rx: 18; }
    .title { font-size: 28px; font-weight: 700; }
    .label { font-size: 20px; font-weight: 600; }
    .small { font-size: 16px; fill: #57606a; }
    .line { stroke: #8c959f; stroke-width: 3; }
  </style>

  <rect x="20" y="40" width="240" height="230" class="box"/>
  <text x="140" y="90" text-anchor="middle" class="title">Vault</text>
  <text x="140" y="130" text-anchor="middle" class="label">Dell OptiPlex 7010</text>
  <text x="140" y="165" text-anchor="middle" class="small">8 GB DDR3</text>
  <text x="140" y="195" text-anchor="middle" class="small">Reused HDDs</text>
  <text x="140" y="225" text-anchor="middle" class="small">OpenMediaVault</text>

  <line x1="260" y1="155" x2="365" y2="155" class="line"/>

  <rect x="365" y="40" width="300" height="230" class="box"/>
  <text x="515" y="90" text-anchor="middle" class="title">Core</text>
  <text x="515" y="135" text-anchor="middle" class="label">SMB Storage</text>
  <text x="515" y="175" text-anchor="middle" class="label">Tailscale</text>
  <text x="515" y="215" text-anchor="middle" class="label">Docker Compose</text>

  <line x1="665" y1="155" x2="770" y2="155" class="line"/>

  <rect x="770" y="40" width="310" height="230" class="box"/>
  <text x="925" y="90" text-anchor="middle" class="title">Services</text>
  <text x="925" y="140" text-anchor="middle" class="label">Jellyfin</text>
  <text x="925" y="180" text-anchor="middle" class="small">Movies &amp; TV</text>
  <text x="925" y="225" text-anchor="middle" class="label">AdGuard Home</text>
</svg>
